name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test-and-build:
    name: Backend Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eventpass
          POSTGRES_PASSWORD: eventpass_secret
          POSTGRES_DB: eventpass_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run ESLint
        working-directory: backend
        run: npm run lint

      - name: Check code formatting
        working-directory: backend
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run prisma:generate

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql://eventpass:eventpass_secret@localhost:5432/eventpass_test_db?schema=public
        run: npx prisma migrate deploy

      - name: Run unit tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://eventpass:eventpass_secret@localhost:5432/eventpass_test_db?schema=public
          JWT_ACCESS_SECRET: eventpass_super_secret_jwt_access_key_min_32_characters
          JWT_REFRESH_SECRET: eventpass_super_secret_jwt_refresh_key_min_32_characters
        run: npm run test

      - name: Run end-to-end integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://eventpass:eventpass_secret@localhost:5432/eventpass_test_db?schema=public
          JWT_ACCESS_SECRET: eventpass_super_secret_jwt_access_key_min_32_characters
          JWT_REFRESH_SECRET: eventpass_super_secret_jwt_refresh_key_min_32_characters
          NODE_ENV: test
        run: npm run test:e2e

      - name: Export OpenAPI specification
        working-directory: backend
        env:
          DATABASE_URL: postgresql://eventpass:eventpass_secret@localhost:5432/eventpass_test_db?schema=public
          JWT_ACCESS_SECRET: eventpass_super_secret_jwt_access_key_min_32_characters
          JWT_REFRESH_SECRET: eventpass_super_secret_jwt_refresh_key_min_32_characters
        run: npm run export:openapi

      - name: Build NestJS application
        working-directory: backend
        run: npm run build

  docker-build:
    name: Build Multi-Stage Docker Image
    runs-on: ubuntu-latest
    needs: backend-test-and-build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: eventpass-backend:latest

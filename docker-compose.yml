services:
  postgres:
    image: postgres:16-alpine
    container_name: eventpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-eventpass}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventpass_secret}
      POSTGRES_DB: ${DB_NAME:-eventpass_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eventpass} -d ${DB_NAME:-eventpass_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventpass-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-eventpass}:${DB_PASSWORD:-eventpass_secret}@postgres:5432/${DB_NAME:-eventpass_db}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-eventpass_super_secret_jwt_access_key_min_32_characters}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-eventpass_super_secret_jwt_refresh_key_min_32_characters}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
      THROTTLE_TTL: ${THROTTLE_TTL:-60000}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-10}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:

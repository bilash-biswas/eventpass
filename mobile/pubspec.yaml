name: eventpass_mobile
description: "EventPass — High-concurrency event ticketing and RSVP mobile platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Design System
  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  cached_network_image: ^3.4.1

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking & Secure Storage
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4

  # Data Modeling & Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Hardware Features: QR Rendering & Camera Scanner
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.7
  screen_brightness: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.15
  freezed: ^2.5.7
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true

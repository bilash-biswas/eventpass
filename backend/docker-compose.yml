services:
  postgres:
    image: postgres:16-alpine
    container_name: eventpass-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-eventpass}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventpass_secret}
      POSTGRES_DB: ${DB_NAME:-eventpass_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eventpass} -d ${DB_NAME:-eventpass_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
